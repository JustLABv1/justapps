name: PR Check

on:
  pull_request:
    branches:
      - main
    paths:
      - '.dockerignore'
      - 'Dockerfile'
      - 'services/**'
      - '.github/workflows/pr-check.yml'

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend_image: ${{ steps.filter.outputs.frontend_image }}
      docs_image: ${{ steps.filter.outputs.docs_image }}
      backend_image: ${{ steps.filter.outputs.backend_image }}
      combined_image: ${{ steps.filter.outputs.combined_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect changed components
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'services/frontend/**'
              - '.github/workflows/pr-check.yml'
            docs:
              - 'services/docs/**'
              - '.github/workflows/pr-check.yml'
            backend:
              - 'services/backend/**'
              - '.github/workflows/pr-check.yml'
            frontend_image:
              - 'services/frontend/Dockerfile'
            docs_image:
              - 'services/docs/Dockerfile'
            backend_image:
              - 'services/backend/Dockerfile'
            combined_image:
              - 'Dockerfile'
              - '.dockerignore'
              - 'services/docs/**'

  build-frontend:
    name: Build Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('services/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  build-backend:
    name: Build Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/backend/go.mod
          cache-dependency-path: services/backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o justapps-backend .

  build-docs:
    name: Build Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/docs

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and validate links
        run: |
          pnpm lint
          pnpm check:links

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  build-frontend-image:
    name: Build Frontend Docker Image
    needs: changes
    if: needs.changes.outputs.frontend_image == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: services/frontend
          file: services/frontend/Dockerfile
          push: false

  build-backend-image:
    name: Build Backend Docker Image
    needs: changes
    if: needs.changes.outputs.backend_image == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: services/backend
          file: services/backend/Dockerfile
          push: false

  build-docs-image:
    name: Build Documentation Docker Image
    needs: changes
    if: needs.changes.outputs.docs_image == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: services/docs
          file: services/docs/Dockerfile
          push: false

  build-combined-image:
    name: Build Combined Docker Image
    needs: changes
    if: needs.changes.outputs.combined_image == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
